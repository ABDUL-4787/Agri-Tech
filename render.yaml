services:
  - type: web
    name: agrigrade-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_TYPE
        value: memory
      - key: PUBLIC_BASE_URL
        sync: false
